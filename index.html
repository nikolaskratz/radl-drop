<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radl Drop</title>
  <meta name="description" content="Fastest MyRadl bike and drop-off station for any trip in Munich">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Radl Drop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=2026102203">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <header class="panel" id="panel">
    <button class="pill" id="pill" type="button" aria-label="Edit trip" aria-controls="panel-body">
      <span class="dot dot-to" aria-hidden="true"></span>
      <span class="pill-text"><span class="pill-to" id="pill-to">Where to?</span><span class="pill-sub" id="pill-sub"></span></span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="panel-body" id="panel-body">
    <div class="field">
      <span class="dot dot-from" aria-hidden="true"></span>
      <input id="from" type="search" autocomplete="off" placeholder="My location" aria-label="Start">
      <button class="icon-btn" id="from-gps" title="Use my location" aria-label="Use my location">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="field">
      <span class="dot dot-to" aria-hidden="true"></span>
      <input id="to" type="search" autocomplete="off" placeholder="Where to?" aria-label="Destination">
      <button class="icon-btn" id="swap" title="Swap" aria-label="Swap start and destination">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 4v14m0 0-3.5-3.5M7 18l3.5-3.5M17 20V6m0 0-3.5 3.5M17 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="modes">
      <div class="seg" id="mode" role="group" aria-label="Do you have a bike?">
        <button data-v="need" aria-pressed="true">Need a bike</button>
        <button data-v="have" aria-pressed="false">On a bike</button>
      </div>
      <div class="seg" id="type" role="group" aria-label="Bike type">
        <button data-v="any" aria-pressed="true">All</button>
        <button data-v="bike" aria-pressed="false">Bike</button>
        <button data-v="ebike" aria-pressed="false">E-bike</button>
      </div>
    </div>
    <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </div>
  </header>

  <section class="sheet" id="sheet" aria-live="polite">
    <button class="grabber" id="grabber" type="button" aria-label="Show details" aria-expanded="false"><span></span></button>
    <div class="sheet-head">
      <div class="hint" id="hint">Loading stations…</div>
      <div class="pager" id="pager" aria-hidden="true"></div>
      <button class="link-btn" id="replan" hidden>Re-plan from here</button>
    </div>
    <ol class="results" id="results"></ol>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js?v=2026102203"></script>
</body>
</html>
